<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none" role="img" aria-label="LeaseLooker" data-size="wide">
  <!-- Hybrid RAG over a lease: the document, a lens pulling out one
       retrieved chunk, and a small embedding grid. .mark-lit elements
       light green when the project row is hovered or focused. -->
  <defs>
    <clipPath id="ll-lens"><circle cx="100" cy="70" r="24"/></clipPath>
  </defs>
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 14 H74 L88 28 V106 H20 Z" stroke-width="3"/>
    <path d="M74 14 V28 H88" stroke-width="3"/>
    <path d="M30 40 H66 M30 50 H78 M30 60 H72 M30 70 H78 M30 80 H62 M30 90 H74" stroke-width="3"/>
  </g>
  <!-- Embedding grid: 3 × 3 vectors, one matched. -->
  <g fill="currentColor">
    <circle cx="114" cy="18" r="2.5"/><circle cx="126" cy="18" r="2.5"/><circle cx="138" cy="18" r="2.5"/>
    <circle cx="114" cy="30" r="2.5"/><circle cx="138" cy="30" r="2.5"/>
    <circle cx="114" cy="42" r="2.5"/><circle cx="126" cy="42" r="2.5"/><circle cx="138" cy="42" r="2.5"/>
  </g>
  <circle class="mark-lit mark-lit--fill" cx="126" cy="30" r="3.5" fill="currentColor"/>
  <!-- Lens: ground-filled so it covers the page, with magnified lines. -->
  <circle cx="100" cy="70" r="24" style="fill: var(--color-ground)" stroke="currentColor" stroke-width="3"/>
  <g clip-path="url(#ll-lens)" stroke-linecap="round">
    <path d="M70 58 H130" stroke="currentColor" stroke-width="5"/>
    <path class="mark-lit" d="M70 72 H124" stroke="currentColor" stroke-width="5"/>
    <path d="M70 86 H118" stroke="currentColor" stroke-width="5"/>
  </g>
  <path d="M117 87 L138 108" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
</svg>

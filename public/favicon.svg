<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- The header brand chip (components/Header.astro), redrawn for tab size:
       bigger body, three heavier pins per edge, "AKA" as stroked paths since
       tabs can't load web fonts. Hex values are copies of the ink / ground
       tokens in src/styles/global.css (an SVG favicon can't read CSS vars) —
       keep them in sync. On dark tab bars the pins and outline flip to
       ground so the package stays visible. -->
  <style>
    .pin, .body { stroke: #141414; }
    .body { fill: #f0f1ed; }
    .ink { fill: #141414; }
    .glyph { stroke: #141414; }
    @media (prefers-color-scheme: dark) {
      .pin, .body { stroke: #f0f1ed; }
    }
  </style>
  <path class="pin" stroke-width="9" d="M44 6V26M64 6V26M84 6V26M44 102V122M64 102V122M84 102V122M6 44H26M6 64H26M6 84H26M102 44H122M102 64H122M102 84H122" />
  <rect class="body" x="24" y="24" width="80" height="80" stroke-width="7" />
  <path class="ink" d="M24 24h20L24 44z" />
  <path class="glyph" stroke-width="6.5" stroke-linejoin="round" d="M34 78 L43 52 L52 78 M37.5 70H48.5 M58 52V78 M74 52 L58 67 M63.5 62 L74 78 M76 78 L85 52 L94 78 M79.5 70H90.5" />
</svg>
